[package]
name = "usblog"
version = "0.1.8"
edition = "2021"
description = "USB event collection and diff tool for Linux"
authors = ["Fabian Affolter <fabian@inradii.tech>"]
license = "MIT"
repository = "https://github.com/inradii/usblog"
keywords = ["usb", "forensics", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "usblog"
path = "src/main.rs"

[dependencies]
clap = { version = "3.2",  features = ["derive"] }
regex = "1.6"
serde = { version = "1.0",  features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4",  features = ["serde"] }
flate2 = "1.0"
prettytable-rs = "0.10"
anyhow = "1.0"
glob = "0.3"
colored = "2.0"
once_cell = "1.15"
